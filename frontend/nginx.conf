server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Preserve the external port so gin-contrib/cors recognizes requests
        # from this Nginx endpoint as same-origin (for example NAS_IP:8090).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8080/openapi.json;
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # The React route /assets collides with Vite's physical assets directory.
    # Serve the SPA for the exact route while keeping /assets/*.js and
    # /assets/*.css available as normal static files.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
