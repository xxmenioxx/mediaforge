name: mvforge

services:
  backend:
    image: ghcr.io/xxmenioxx/mvforge-backend:${MVFORGE_VERSION:-1.0.6}
    restart: unless-stopped
    environment:
      MVFORGE_API_HOST: 0.0.0.0
      MVFORGE_API_PORT: 8080
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_PATH:?Set CONFIG_PATH in .env}:/app/data
      - ${RAW_PATH:?Set RAW_PATH in .env}:/media/raw
      - ${LIBRARY_PATH:?Set LIBRARY_PATH in .env}:/media/library
      - ${STAGING_PATH:?Set STAGING_PATH in .env}:/media/staging
      - ${ARCHIVE_PATH:?Set ARCHIVE_PATH in .env}:/media/originals_archive
      - ${REPORTS_PATH:?Set REPORTS_PATH in .env}:/media/reports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  web:
    image: ghcr.io/xxmenioxx/mvforge-web:${MVFORGE_VERSION:-1.0.6}
    restart: unless-stopped
    ports:
      - "${MVFORGE_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

networks:
  internal:
    driver: bridge
