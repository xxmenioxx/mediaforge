name: Pipeline Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic pipeline scenario
        type: choice
        required: true
        default: happy-path
        options:
          - happy-path
          - track-actions
          - language-normalization
          - language-normalization-exclusions
          - cadence-progressive
          - cadence-ivtc
          - cadence-ambiguous

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pipeline-smoke-pr-{0}', github.event.pull_request.number) || format('pipeline-smoke-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select Pipeline Smoke
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.routes.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select smoke from changed paths
        id: routes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/select_ci_jobs.py

  pipeline-smoke:
    name: pipeline-smoke (${{ inputs.scenario || 'all' }})
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.smoke == 'true') }}
    runs-on: ubuntu-24.04
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      # One runner builds the backend once; future scenarios should execute
      # sequentially here and reuse this image instead of multiplying builds.
      - name: Test isolated Pipeline Smoke harness
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/e2e/test_pipeline_smoke.py
      - name: Require GitHub-hosted runner for disk management
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          echo "Pipeline Smoke disk recovery requires a GitHub-hosted runner." >&2
          exit 1
      - name: Record starting runner storage
        if: ${{ runner.environment == 'github-hosted' }}
        run: ./scripts/ci/runner-disk-capacity.sh report "before Pipeline Smoke backend build"
      - name: Reclaim unused GitHub-hosted toolchains
        if: ${{ runner.environment == 'github-hosted' }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/ci/runner-disk-capacity.sh reclaim
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Check storage before Pipeline Smoke image build
        if: ${{ runner.environment == 'github-hosted' }}
        run: ./scripts/ci/runner-disk-capacity.sh check "before Pipeline Smoke backend build" --buildkit
      - name: Build isolated backend runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          tags: mvforge-backend:pipeline-smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Record storage after Pipeline Smoke image build
        if: ${{ always() && !cancelled() && runner.environment == 'github-hosted' }}
        run: ./scripts/ci/runner-disk-capacity.sh report "after Pipeline Smoke backend build" --buildkit
      - name: Run synthetic pipeline smoke
        id: smoke
        run: |
          scenarios=(happy-path track-actions language-normalization language-normalization-exclusions cadence-progressive cadence-ivtc cadence-ambiguous)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            scenarios=("${{ inputs.scenario }}")
          fi
          for scenario in "${scenarios[@]}"; do
            ./scripts/e2e/run-pipeline-smoke.sh --scenario "$scenario" --image mvforge-backend:pipeline-smoke --run-id "${E2E_RUN_ID}-${scenario}" --no-build
          done
      - name: Upload bounded failure evidence
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-smoke-failure-evidence
          path: ${{ runner.temp }}/mvforge-e2e-${{ env.E2E_RUN_ID }}-*/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove this run's temporary root
        if: always()
        run: |
          for scenario in happy-path track-actions language-normalization language-normalization-exclusions cadence-progressive cadence-ivtc cadence-ambiguous; do
            python3 scripts/e2e/cleanup-run-root.py --run-id "${E2E_RUN_ID}-${scenario}"
          done
