name: Pipeline Smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/e2e/**"
      - ".github/workflows/pipeline-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/e2e/**"
      - ".github/workflows/pipeline-smoke.yml"
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic pipeline scenario
        type: choice
        required: true
        default: happy-path
        options:
          - happy-path

permissions:
  contents: read

concurrency:
  group: pipeline-smoke-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scenario || 'happy-path' }}
  cancel-in-progress: true

jobs:
  pipeline-smoke:
    name: pipeline-smoke (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(format('["{0}"]', inputs.scenario || 'happy-path')) }}
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build isolated backend runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          tags: mvforge-backend:pipeline-smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Run synthetic pipeline smoke
        id: smoke
        run: ./scripts/e2e/run-pipeline-smoke.sh --scenario "${{ matrix.scenario }}" --image mvforge-backend:pipeline-smoke --run-id "$E2E_RUN_ID" --no-build
      - name: Upload bounded failure evidence
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-smoke-${{ matrix.scenario }}-failure-evidence
          path: ${{ runner.temp }}/mvforge-e2e-${{ env.E2E_RUN_ID }}/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove this run's temporary root
        if: always()
        run: python3 scripts/e2e/cleanup-run-root.py --run-id "$E2E_RUN_ID"
