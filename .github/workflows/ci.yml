name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep every job on this fixed Ubuntu image for comparable CI results.
jobs:
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for license verification
        working-directory: frontend
        run: npm ci
      - name: Verify licensing and release guardrails
        run: ./scripts/verify-compliance.sh

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (advisory until the existing baseline is fixed)
        continue-on-error: true
        run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          push: false
          tags: mvforge-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          target: production
          push: false
          tags: mvforge-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate NAS Compose
        env:
          CONFIG_PATH: /tmp/mvforge/config
          RAW_PATH: /tmp/mvforge/raw
          LIBRARY_PATH: /tmp/mvforge/library
          STAGING_PATH: /tmp/mvforge/staging
          ARCHIVE_PATH: /tmp/mvforge/archive
          REPORTS_PATH: /tmp/mvforge/reports
        run: docker compose -f deploy/nas/compose.yml config --quiet
