name: Release container images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

# Keep every job on this fixed Ubuntu image for comparable CI and release builds.
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run compliance:licenses -- --require-complete
          npm run build
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build matching backend corresponding-source archive
        run: ./scripts/build-corresponding-source.sh "$RUNNER_TEMP/mvforge-corresponding-source.tar.gz"
      - name: Prepare release evidence assets
        run: |
          mkdir "$RUNNER_TEMP/mvforge-release-evidence"
          cp "$RUNNER_TEMP/mvforge-corresponding-source.tar.gz" "$RUNNER_TEMP/mvforge-release-evidence/"
          cp "$RUNNER_TEMP/mvforge-corresponding-source.tar.gz.sha256" "$RUNNER_TEMP/mvforge-release-evidence/"
          cp LICENSE NOTICE LEGAL.md THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/mvforge-release-evidence/"
          cp backend/licenses/GO_MODULES.txt backend/licenses/GO_LICENSES.csv backend/licenses/GO_LICENSES.md "$RUNNER_TEMP/mvforge-release-evidence/"
          cp frontend/licenses/npm/inventory.json "$RUNNER_TEMP/mvforge-release-evidence/frontend-NPM-inventory.json"
          cp frontend/licenses/npm/THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/mvforge-release-evidence/frontend-THIRD_PARTY_NOTICES.txt"
      - name: Validate NAS Compose
        env:
          CONFIG_PATH: /tmp/mvforge/config
          RAW_PATH: /tmp/mvforge/raw
          LIBRARY_PATH: /tmp/mvforge/library
          STAGING_PATH: /tmp/mvforge/staging
          ARCHIVE_PATH: /tmp/mvforge/archive
          REPORTS_PATH: /tmp/mvforge/reports
        run: docker compose -f deploy/nas/compose.yml config --quiet
      - name: Verify licensing and release guardrails
        env:
          MVFORGE_REQUIRE_RELEASE_EVIDENCE: "true"
          MVFORGE_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/mvforge-release-evidence
        run: ./scripts/verify-compliance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mvforge-release-compliance-evidence
          path: ${{ runner.temp }}/mvforge-release-evidence
          if-no-files-found: error

  release-gate:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      MVFORGE_PUBLIC_RELEASES_ENABLED: ${{ vars.MVFORGE_PUBLIC_RELEASES_ENABLED }}
      MVFORGE_EXISTING_DISTRIBUTIONS_REVIEWED: ${{ vars.MVFORGE_EXISTING_DISTRIBUTIONS_REVIEWED }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: mvforge-release-compliance-evidence
          path: ${{ runner.temp }}/mvforge-release-evidence
      - name: Verify required release-side evidence
        run: ./scripts/verify-release-evidence.sh "$RUNNER_TEMP/mvforge-release-evidence"
      - name: Enforce temporary public-release hold
        shell: bash
        run: |
          if [ "${MVFORGE_PUBLIC_RELEASES_ENABLED:-false}" != "true" ]; then
            echo "Public MVForge releases are paused by compliance policy."
            echo "Set MVFORGE_PUBLIC_RELEASES_ENABLED=true only after issue #57 is cleared."
            exit 1
          fi
          if [ "${MVFORGE_EXISTING_DISTRIBUTIONS_REVIEWED:-false}" != "true" ]; then
            echo "Retained GHCR images and historical distribution evidence have not been approved."
            echo "Set MVFORGE_EXISTING_DISTRIBUTIONS_REVIEWED=true only after external review."
            exit 1
          fi

  publish:
    needs: release-gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/xxmenioxx/mvforge-backend
            context: ./backend
            target: ""
          - name: web
            image: ghcr.io/xxmenioxx/mvforge-web
            context: ./frontend
            target: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=MVForge ${{ matrix.name }}
            org.opencontainers.image.description=MVForge self-hosted media processing platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify image digest and BuildKit attestations
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: ./scripts/verify-image-attestations.sh "$IMAGE_NAME" "$IMAGE_DIGEST"
      - name: Record exact published image digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > "$RUNNER_TEMP/${{ matrix.name }}-image-digest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mvforge-image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}-image-digest.txt
          if-no-files-found: error

  release:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: mvforge-release-compliance-evidence
          path: ${{ runner.temp }}/mvforge-release-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: mvforge-image-digest-*
          path: ${{ runner.temp }}/mvforge-image-digests
          merge-multiple: true
      - name: Verify evidence and collect image digests
        run: |
          ./scripts/verify-release-evidence.sh "$RUNNER_TEMP/mvforge-release-evidence"
          test -s "$RUNNER_TEMP/mvforge-image-digests/backend-image-digest.txt"
          test -s "$RUNNER_TEMP/mvforge-image-digests/web-image-digest.txt"
          cat "$RUNNER_TEMP/mvforge-image-digests/backend-image-digest.txt" \
              "$RUNNER_TEMP/mvforge-image-digests/web-image-digest.txt" \
              > "$RUNNER_TEMP/mvforge-release-evidence/image-digests.txt"
      - name: Package NAS installer
        run: |
          cp deploy/nas/compose.yml mvforge-compose.yml
          cp deploy/nas/.env.example mvforge.env.example
          cp deploy/nas/backup.sh mvforge-backup.sh
          release_version="${GITHUB_REF_NAME#v}"
          sed -i "s/^MVFORGE_VERSION=.*/MVFORGE_VERSION=${release_version}/" mvforge.env.example
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mvforge-compose.yml \
            mvforge.env.example \
            mvforge-backup.sh \
            LICENSE NOTICE LEGAL.md THIRD_PARTY_LICENSES.md \
            "$RUNNER_TEMP/mvforge-release-evidence/mvforge-corresponding-source.tar.gz" \
            "$RUNNER_TEMP/mvforge-release-evidence/mvforge-corresponding-source.tar.gz.sha256" \
            "$RUNNER_TEMP/mvforge-release-evidence/GO_MODULES.txt" \
            "$RUNNER_TEMP/mvforge-release-evidence/GO_LICENSES.csv" \
            "$RUNNER_TEMP/mvforge-release-evidence/GO_LICENSES.md" \
            "$RUNNER_TEMP/mvforge-release-evidence/frontend-NPM-inventory.json" \
            "$RUNNER_TEMP/mvforge-release-evidence/frontend-THIRD_PARTY_NOTICES.txt" \
            "$RUNNER_TEMP/mvforge-release-evidence/image-digests.txt" \
            --generate-notes \
            --title "MVForge $GITHUB_REF_NAME"
