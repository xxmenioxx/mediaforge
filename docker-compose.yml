services:
  backend:
    build:
      context: ./backend
    environment:
      MVFORGE_API_HOST: 0.0.0.0
      MVFORGE_API_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data
      - /volume1/docker/nas-media-stack/config/mediaforge/ssh:/etc/mvforge/ssh:ro
      - ./media/raw:/media/raw
      - ./media/library:/media/library
      - ./media/staging:/media/staging
      - ./media/originals_archive:/media/originals_archive
      - ./media/reports:/media/reports

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
